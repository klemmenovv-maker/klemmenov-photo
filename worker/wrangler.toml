# Cloudflare Worker for the booking system.
# Secrets are NEVER stored here. Set them with `wrangler secret put <NAME>`:
#   ZIINA_TOKEN            Ziina API token
#   ZIINA_WEBHOOK_SECRET   HMAC secret registered with the Ziina webhook (REQUIRED when
#                          ZIINA_TEST = "false": the webhook answers 503 without it)
#   TELEGRAM_BOT_TOKEN     Telegram bot token
#   TELEGRAM_CHAT_ID       Telegram chat id of the owner
#   CRM_WEBHOOK_URL        CRM webhook (Apps Script web app URL), see REQUEST_SETUP.md
#   CRM_WEBHOOK_SECRET     Optional shared secret sent in the webhook body
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / GOOGLE_OAUTH_REFRESH_TOKEN
#     Owner OAuth for the shared calendar (alternative to GOOGLE_SA_JSON).
#   GOOGLE_SA_JSON         Google service account JSON (calendar access)
name = "klemmenov-booking"
main = "index.mjs"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "BOOKINGS"
id = "0e40ee62916d484fb6717b71a601a4ba"

[vars]
SCHEDULE_ONLY = "true"
ALLOWED_ORIGINS = "https://klemmenovv-maker.github.io"
SITE_URL = "https://klemmenovv-maker.github.io/klemmenov-photo"
ZIINA_TEST = "true"
REQUIRE_TERMS = "true"
GOOGLE_CALENDAR_ID = "37cc485a3e15153d6531413e920770e497404ee0e5338a9e5204efb2d843f7a7@group.calendar.google.com"

[triggers]
crons = ["*/5 * * * *"]
